name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HUSKY: "0"

      # Dedicated test database
      DATABASE_URL: ${{ secrets.PLAYWRIGHT_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.PLAYWRIGHT_DATABASE_URL }}
      PLAYWRIGHT_DATABASE_URL: ${{ secrets.PLAYWRIGHT_DATABASE_URL }}

      # Test Supabase project
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_TEST_PROJECT_REF: ${{ vars.PLAYWRIGHT_TEST_PROJECT_REF }}

      # Test user
      PLAYWRIGHT_TEST_EMAIL: ${{ vars.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}

      # E2E safety
      PLAYWRIGHT_ALLOW_DATABASE_RESET: "true"
      PLAYWRIGHT_ISOLATED_DB_ACK: "DISPOSABLE_TEST_DATABASE"

      # Application
      PLAYWRIGHT_SERVER_COMMAND: npm run start
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate isolated E2E environment
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            DATABASE_URL \
            DIRECT_URL \
            TEST_DATABASE_URL \
            PLAYWRIGHT_DATABASE_URL \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            PLAYWRIGHT_TEST_PROJECT_REF \
            PLAYWRIGHT_TEST_EMAIL \
            PLAYWRIGHT_TEST_PASSWORD; do

            if [ -z "${!name:-}" ]; then
              echo "::error::Missing E2E configuration: $name"
              exit 1
            fi
          done

          expected_url="https://${PLAYWRIGHT_TEST_PROJECT_REF}.supabase.co"

          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "$expected_url" ]; then
            echo "::error::Supabase URL does not match test project ref"
            exit 1
          fi

          for name in DATABASE_URL DIRECT_URL TEST_DATABASE_URL PLAYWRIGHT_DATABASE_URL; do
            if [[ "${!name}" != *"${PLAYWRIGHT_TEST_PROJECT_REF}"* ]]; then
              echo "::error::$name does not reference the dedicated test project"
              exit 1
            fi
          done

          echo "E2E configuration validated"

      - name: Apply migrations to dedicated E2E database
        run: npx prisma migrate deploy

      - name: Seed E2E database
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build production app
        run: npm run build

      - name: PR smoke tests on production build
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke

      - name: Full E2E on main or manual run
        if: github.event_name != 'pull_request'
        run: npm run test:e2e

      - name: Cross-browser smoke tests
        run: npx playwright test --project=firefox-smoke --project=webkit-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
