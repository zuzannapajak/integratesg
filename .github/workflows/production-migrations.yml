name: Production database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      HUSKY: "0"
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production database secrets
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::Configure PRODUCTION_DATABASE_URL and PRODUCTION_DIRECT_URL in the protected production environment."
            exit 1
          fi

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Show migration status
        run: npx prisma migrate status

      - name: Apply production migrations
        run: npx prisma migrate deploy
